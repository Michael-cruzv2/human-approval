# Non-secret configuration. Secrets live in environment variables (see ../.env.example).
app:
  name: "Lead Review"
  max_active_users: 3

auth:
  otp_length: 6
  otp_ttl_minutes: 10
  otp_max_attempts: 5
  otp_resend_cooldown_seconds: 60
  otp_max_requests_per_email_per_hour: 5
  otp_max_requests_per_ip_per_hour: 20
  failed_verify_lockout_threshold: 10
  failed_verify_lockout_minutes: 15
  session_idle_hours: 8
  session_absolute_days: 7
  cookie_name: "__Host-session"

review:
  lead_queue_page_size: 50
  draft_queue_page_size: 25
  require_note_on_reject: true
  allow_bulk_reject_leads: true
  allow_bulk_approve: false          # must stay false (R6)

import:
  max_file_mb: 5
  max_rows: 2000
  max_cell_chars: 2000
  max_invalid_row_ratio: 0.5
  max_uploads_per_user_per_hour: 10

display:
  # Read-only values shown on the dashboard. LeadMailer enforces the real limits.
  batch_size: 5
  daily_ceiling: 20
  max_attempts: 3
